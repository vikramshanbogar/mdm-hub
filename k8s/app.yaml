apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdm-hub-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mdm-hub-app
  template:
    metadata:
      labels:
        app: mdm-hub-app
    spec:
      containers:
        - name: mdm-hub
          # Build and push this image first: docker build -t <your-registry>/mdm-hub:0.1.0 .
          image: <your-registry>/mdm-hub:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mdm-hub-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mdm-hub-postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mdm-hub-postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mdm-hub-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mdm-hub-app
spec:
  type: ClusterIP
  selector:
    app: mdm-hub-app
  ports:
    - port: 80
      targetPort: 8080
