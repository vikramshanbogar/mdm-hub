services:
  postgres:
    image: postgres:16-alpine
    container_name: mdm-hub-postgres
    environment:
      POSTGRES_DB: mdmhub
      POSTGRES_USER: mdmhub
      POSTGRES_PASSWORD: mdmhub
    ports:
      - "5432:5432"
    volumes:
      - mdm_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdmhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: mdm-hub-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mdmhub
      DB_USER: mdmhub
      DB_PASSWORD: mdmhub
    ports:
      - "8080:8080"

volumes:
  mdm_hub_pgdata:
